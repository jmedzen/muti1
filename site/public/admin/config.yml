  # ── 單頁：生平、畫論 ──
  - name: longform
    label: 長文
    files:
      - name: biography
        label: 生平
        file: content/md/longform/biography.md
        fields:
          - { name: title, label: 標題, widget: string }
          - { name: route, widget: hidden }
          - { name: legacyRoute, widget: hidden }
          - *a_body
      - name: painting-view
        label: 我的繪畫觀
        file: content/md/longform/painting-view.md
        fields:
          - { name: title, label: 標題, widget: string }
          - { name: route, widget: hidden }
          - { name: legacyRoute, widget: hidden }
          - *a_body

  # ── 站台設定 ──
  # ⚠️ 從後台存檔會移除 site.md 裡的 YAML 註解（# 開頭的說明文字），內容本身不受影響。
  - name: settings
    label: 站台設定
    files:
      - name: site
        label: 站名、選單、聯絡方式、首頁大圖
        file: content/md/site.md
        fields:
          - { name: name, label: 站名, widget: string }
          - { name: nameEn, label: 英文站名, widget: string, required: false }
          - { name: tagline, label: 標語, widget: string, required: false }
          - { name: description, label: 網站描述（SEO）, widget: text, required: false }
          - { name: lang, label: 語言代碼, widget: string, default: zh-Hant }
          - { name: footerText, label: 頁尾文字, widget: string, required: false }
          - name: menu
            label: 主選單
            widget: list
            summary: "{{fields.title}} → {{fields.href}}"
            fields:
              - { name: title, label: 名稱, widget: string }
              - { name: href, label: 連結, widget: string }
              - name: children
                label: 子選單
                widget: list
                required: false
                summary: "{{fields.title}} → {{fields.href}}"
                fields:
                  - { name: title, label: 名稱, widget: string }
                  - { name: href, label: 連結, widget: string }
                  - { name: children, widget: hidden, default: [] }
          - name: contact
            label: 聯絡方式
            widget: object
            fields:
              - name: phones
                label: 電話
                widget: list
                required: false
                summary: "{{fields.label}}：{{fields.value}}"
                fields:
                  - { name: label, label: 標籤, widget: string }
                  - { name: value, label: 顯示文字, widget: string }
                  - { name: tel, label: 撥號號碼, widget: string, required: false, hint: 例如 +886289935275 }
              - name: emails
                label: 信箱
                widget: list
                required: false
                summary: "{{fields.label}}：{{fields.value}}"
                fields:
                  - { name: label, label: 標籤, widget: string }
                  - { name: value, label: 信箱, widget: string }
              - name: im
                label: 通訊軟體
                widget: list
                required: false
                summary: "{{fields.label}}：{{fields.value}}"
                fields:
                  - { name: label, label: 標籤, widget: string }
                  - { name: value, label: 帳號, widget: string }
              - { name: website, label: 網站, widget: string, required: false }
              - { name: hours, label: 開放時間, widget: string, required: false }
              - { name: address, label: 地址, widget: string, required: false }
          - name: hero
            label: 首頁大圖（輪播）
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { name: title, label: 標題, widget: string }
              - { name: image, label: 圖片, widget: image }
              - { name: cta, label: 按鈕文字, widget: string, required: false }
              - { name: ctaHref, label: 按鈕連結, widget: string, required: false }
          - { name: body, label: 首頁區塊摘要（僅供參考，不影響版面）, widget: text, required: false }
