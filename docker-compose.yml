services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: luisang-museum:latest
    container_name: luisang-museum
    restart: unless-stopped
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    labels:
      # 方便日後接 Traefik / Caddy
      - "traefik.enable=false"

  # 本機 HTTPS 或反向代理時再加，預設不啟用
