    label: 作品・山水
    label_singular: 山水作品
    folder: content/md/collections/landscape
    create: true
    slug: "{{code}}"
    identifier_field: code
    summary: "{{code}} {{name}}"
    sortable_fields: [order, code, year]
    fields:
      - { name: album, widget: hidden, default: landscape }
      - { name: kind, widget: hidden, default: artwork }
      - *i_code
      - *i_order
      - *i_name
      - *i_dimensions
      - *i_year
      - *i_yearGanzhi
      - *i_titleEn
      - *i_medium
      - *i_note
      - *i_image
      - *i_caption
      - *i_eventDate
      - *i_body

