# 黃磊生美術館官網 — nginx 設定
#
# 目標：
#   1. 乾淨網址（/about/ 而不是 /about/index.html）
#   2. 舊 Joomla 網址 301（等同 _redirects 的行為）
#   3. 正確的快取標頭（HTML 每次驗證、fingerprint 資產永久）
#   4. gzip + brotli（若模組存在）

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # 不要把 nginx 版本號漏出去
    server_tokens off;

    # ── 日誌 ──
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # ══════════════════════════════════════════════════════════════ 壓縮
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        application/rss+xml application/manifest+json
        image/svg+xml font/woff2;

    # ══════════════════════════════════════════════════════════════ 安全標頭
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; form-action 'self'; base-uri 'self'; frame-ancestors 'self'" always;

    # ══════════════════════════════════════════════════════════════ 快取
    # HTML：每次回源驗證（改版後訪客不會看到舊頁）
    location ~* \.html$ {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # 建置產物與圖片：檔名含內容特徵，可永久快取
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    location /media/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        access_log off;
        try_files $uri =404;
    }

    location /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        access_log off;
        try_files $uri =404;
    }

    # ══════════════════════════════════════════════════════════════ 舊網址轉址
    # 與 site/public/_redirects 對應；nginx 的寫法不同，這裡列主要規則。
    # 完整 42 篇文章的對應請見 _redirects（Cloudflare 版）。

    # /index.php/news/<cat>/<slug>  →  /news/<cat>/<slug>
    location ~ ^/index\.php/news/(.*)$ {
        return 301 /news/$1$is_args$args;
    }
    # /index.php/art-reviews/<slug> →  /art-reviews/<slug>
    location ~ ^/index\.php/art-reviews/(.*)$ {
        return 301 /art-reviews/$1$is_args$args;
    }
    # /index.php/artist-luisang/<slug> → /artist-luisang/<slug>
    location ~ ^/index\.php/artist-luisang/(.*)$ {
        return 301 /artist-luisang/$1$is_args$args;
    }

    # 舊分類頁
    location = /index.php/artist-luisang { return 301 /about; }
    location = /index.php/art-reviews    { return 301 /art-reviews; }
    location = /index.php/contact        { return 301 /contact; }
    location = /index.php/search         { return 301 /search; }
    location = /index.php                { return 301 /; }
    location = /index.php/component/users { return 301 /; }
    location = /index.php/component/search { return 301 /search; }

    # 舊相簿
    # 原站同一本相簿有多個入口：/index.php/landscape/<slug>、/index.php/art-life/<slug>、
    # /landscape/<slug>、/<slug>/<slug>。這些都要能到同一頁，否則把某條加書籤的人會撞 404。
    # 用正規式一次涵蓋四種前綴 —— 逐條手寫會漏（實際就漏了 art-life 那一整組）。

    # 藝術生活區塊首頁
    location = /index.php/art-life { return 301 /life; }
    location = /art-life           { return 301 /life; }

    # 作品相簿
    location ~ ^/(?:index\.php/)?(?:landscape/)?landscape/?$          { return 301 /collection/landscape; }
    location ~ ^/(?:index\.php/)?(?:landscape/|art-life/)?flowers-birds-insects-fish/?$ { return 301 /collection/flowers-birds; }
    location ~ ^/(?:index\.php/)?(?:landscape/|art-life/)?calligraphy/?$ { return 301 /collection/calligraphy; }

    # 藝術生活相簿（三種前綴都吃）
    location ~ ^/(?:index\.php/)?(?:landscape/|art-life/)?exhibition-exchange/?$ { return 301 /life/exhibition-exchange; }
    location ~ ^/(?:index\.php/)?(?:landscape/|art-life/)?life-footprint/?$      { return 301 /life/life-footprint; }
    location ~ ^/(?:index\.php/)?(?:landscape/|art-life/)?art-exchange/?$        { return 301 /life/art-exchange; }

    # <slug>/<slug> 形式（原站的「分類/別名」寫法）
    location ~ ^/(landscape|calligraphy|art-life)/(?:landscape|calligraphy|art-life)$ { return 301 /collection/$1; }

    # 舊新聞總覽與 Joomla 內建搜尋
    location = /index.php/news                     { return 301 /news; }
    location = /index.php/component/finder/search  { return 301 /search; }
    location = /index.php/component/search         { return 301 /search; }

    # 其餘 /index.php/* 一律導到搜尋頁
    location ~ ^/index\.php/ {
        return 302 /search;
    }

    # ══════════════════════════════════════════════════════════════ 乾淨網址
    location / {
        # 先找檔案，再找目錄的 index.html，最後 404
        try_files $uri $uri/ $uri.html /404.html =404;
    }

    # 搜尋頁不進索引
    location = /search {
        add_header X-Robots-Tag "noindex, follow" always;
        try_files $uri $uri/ /search/index.html =404;
    }

    # 404
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-store" always;
    }

    # 不要把 .htaccess / dotfile 送出去
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
    }
}
