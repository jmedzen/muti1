name: 部署到 Cloudflare Workers

# 需要兩個 repo secret：
#   CLOUDFLARE_API_TOKEN   —— 權限：Workers Scripts:Edit、Account Settings:Read
#   CLOUDFLARE_ACCOUNT_ID  —— 在 Cloudflare dashboard 右下角可找到
#
# 沒設定 secret 的話這個 workflow 會失敗（不會動到任何東西）。
# 本機手動部署則是用 `npm run deploy`（見 README）。

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "content/**"
      - "tools/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只做 dry-run（不真的部署）"
        type: boolean
        default: false

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: true

jobs:
  # 先確認 secrets 有沒有設。
  # 沒設就直接跳過整個部署，而不是讓它跑到底再失敗 ——
  # 一個永遠紅的 workflow 很快就不會有人看它了。
  preflight:
    name: 檢查部署憑證
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    steps:
      - id: check
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "✓ 憑證已設定，繼續部署"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            {
              echo "### 略過部署：缺少 Cloudflare 憑證"
              echo ""
              echo "請在 repo 設定這兩個 secret："
              echo ""
              echo "| Secret | 說明 |"
              echo "|---|---|"
              echo "| `CLOUDFLARE_API_TOKEN` | 權限：Workers Scripts:Edit、Account Settings:Read |"
              echo "| `CLOUDFLARE_ACCOUNT_ID` | Cloudflare dashboard 右下角 |"
              echo ""
              echo "設定路徑：Settings → Secrets and variables → Actions → New repository secret"
              echo ""
              echo "本機部署則用 `npm run deploy`（需要先 `wrangler login`）。"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "（略過部署：缺少 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID）"
          fi

  deploy:
    name: 建置並部署
    needs: preflight
    if: needs.preflight.outputs.ok == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Astro 7 要求 >=22.23.4，指定 22 會拿到較舊的 patch 版本而被拒絕。
          # 用 24（LTS，Actions 一定拿得到）。
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: 安裝相依套件
        working-directory: site
        run: npm ci

      - name: 同步內容
        run: node tools/sync.mjs

      - name: 建置
        working-directory: site
        run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: "1"

      # 部署前先確認產出是完整的，不要把壞的站推上線
      - name: 部署前檢查
        run: |
          node tools/link-check.mjs
          test -f site/dist/_redirects || { echo "缺少 _redirects"; exit 1; }
          test -f site/dist/_headers   || { echo "缺少 _headers"; exit 1; }
          test -f site/dist/404.html   || { echo "缺少 404.html"; exit 1; }

      - name: Dry run
        if: inputs.dry_run
        run: node tools/wrangler.mjs deploy --dry-run
        env:
          XDG_CONFIG_HOME: ${{ github.workspace }}/.wrangler-home
          WRANGLER_SEND_METRICS: "false"

      - name: 部署
        if: ${{ !inputs.dry_run }}
        run: node tools/wrangler.mjs deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          XDG_CONFIG_HOME: ${{ github.workspace }}/.wrangler-home
          WRANGLER_SEND_METRICS: "false"

      - name: 部署後線上檢查
        if: ${{ !inputs.dry_run }}
        run: |
          # Workers 的正式網址格式：<name>.<subdomain>.workers.dev
          URL="https://luisang-museum.workers.dev"
          echo "檢查 $URL"
          for path in / /about/ /sitemap.xml; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$URL$path" || echo "000")
            echo "  $path → $code"
            case "$path" in
              /about/) [ "$code" = "200" ] || { echo "不合格"; exit 1; } ;;
            esac
          done
          # 舊網址要 301
          code=$(curl -s -o /dev/null -w "%{http_code}" "$URL/index.php/artist-luisang" || echo "000")
          echo "  /index.php/artist-luisang → $code（應為 301）"
          [ "$code" = "301" ] || { echo "轉址失效"; exit 1; }
